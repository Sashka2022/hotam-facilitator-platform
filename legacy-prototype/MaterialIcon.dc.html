<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    svg { display: block; }
  </style>
</helmet>
<div style="width: {{size}}px; height: {{size}}px; color: {{color}};">
  <sc-if value="{{isPresentation}}" hint-placeholder-val="{{true}}">
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="12" rx="2"></rect>
      <path d="M8 20h8"></path>
      <path d="M12 16v4"></path>
      <path d="M7 12l3-3 2 2 4-4"></path>
    </svg>
  </sc-if>
  <sc-if value="{{isVideo}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M10 8.5l6 3.5-6 3.5z"></path>
    </svg>
  </sc-if>
  <sc-if value="{{isArticle}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h9l3 3v15H6z"></path>
      <path d="M15 3v4h4"></path>
      <path d="M9 12h6"></path>
      <path d="M9 16h6"></path>
    </svg>
  </sc-if>
  <sc-if value="{{isWorksheet}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="4" width="12" height="16" rx="2"></rect>
      <path d="M9 4h6v2H9z"></path>
      <path d="M9 12l2 2 4-4"></path>
    </svg>
  </sc-if>
</div>
<script data-dc-script data-props='{"isPresentation":{"editor":null,"default":true},"isVideo":{"editor":null,"default":false},"isArticle":{"editor":null,"default":false},"isWorksheet":{"editor":null,"default":false},"color":{"editor":null,"default":"#0048FF"},"size":{"editor":null,"default":28}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      isPresentation: this.props.isPresentation ?? true,
      isVideo: this.props.isVideo ?? false,
      isArticle: this.props.isArticle ?? false,
      isWorksheet: this.props.isWorksheet ?? false,
      color: this.props.color ?? '#0048FF',
      size: this.props.size ?? 28,
    };
  }
}
</script>
</x-dc>
</body>
</html>
